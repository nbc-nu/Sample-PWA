<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Progressive web app</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#317EFB">
  <style>
    body { 
      font-family: Arial, sans-serif; 
      text-align: center; 
      padding-top: 100px; 
      background-color: #f4f4f9;
      color: #333;
    }
  </style>
</head>
<body>

  <h1>Intall with the URL bar button, look! ↗️</h1>
  <p>Click in the donwload icon!</p>

  <script>
    // Registro do Service Worker (Obrigatório para ativar o botão lá de cima)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('service worker on:', reg.scope))
          .catch(err => console.error('Service Worker Error:', err));
      });
    }

    // Deixamos o evento livre. Não usamos o preventDefault(), 
    // assim o navegador sabe que pode exibir o botão dele lá em cima quando quiser.
    window.addEventListener('beforeinstallprompt', (e) => {
      console.log('Browser detected that the app is ready to install');
    });
  </script>
</body>
</html>
